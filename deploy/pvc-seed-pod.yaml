# 一次性辅助 pod：把备份文件灌进 mischicat-sqlite 这块 PVC。
# 只在 emptyDir → PVC 迁移时用一次，用完删掉。
#
# 用法（bot 必须先 scale 到 0，否则会和它抢写锁）：
#   kubectl scale deploy/mischicat-bot --replicas=0
#   kubectl apply -f deploy/pvc-seed-pod.yaml
#   kubectl wait --for=condition=Ready pod/pvc-seed --timeout=60s
#   kubectl cp ./game-backup.db pvc-seed:/data/game.db
#   kubectl exec pvc-seed -- ls -la /data          # 确认文件大小对得上
#   kubectl delete pod pvc-seed
#   kubectl scale deploy/mischicat-bot --replicas=1
apiVersion: v1
kind: Pod
metadata:
  name: pvc-seed
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: sqlite-data
          mountPath: /data
  volumes:
    - name: sqlite-data
      persistentVolumeClaim:
        claimName: mischicat-sqlite
