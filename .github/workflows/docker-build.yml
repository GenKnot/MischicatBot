name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # 每周一 04:00 UTC 重建一次。代码没变，但会装上最新的 yt-dlp ——
  # YouTube 的播放器和签名方案变得快，几个月不更新就失效。
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  # 测试不过就不构建 / 不发版。
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/mischicat-bot" >> $GITHUB_ENV

      # 带上 commit sha，排查时能直接对上线上跑的是哪个提交
      - name: Get timestamp tag
        id: get_tag
        run: echo "tag=alpha$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.get_tag.outputs.tag }}
          file: Dockerfile
          build-args: |
            APP_VERSION=${{ steps.get_tag.outputs.tag }}

      # 原先这里还有一步「更新 GitOps 仓库（yulexun/flux）里的镜像 tag」，
      # 由那边集群的 Flux 自动部署。该服务器已停用，2026-09-23 删除。
      # 以后换新的部署目标时，在这里接上即可；镜像本身照常推到 ghcr。
