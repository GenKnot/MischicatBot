version: '3.8'
services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: pot-provider
    restart: unless-stopped

  mischicat-bot:
    # CI 发布到 GHCR 的镜像。若想用本地源码构建，把 image 换成 `build: .`
    image: ghcr.io/genknot/mischicat-bot/mischicat-bot:latest
    container_name: mischicat-bot
    env_file:
      - .env
    environment:
      # 告诉 yt-dlp 插件去哪里取 PO token（服务名来自上面的 pot-provider）
      POT_PROVIDER_URL: http://pot-provider:4416
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/app/sqlite-data
    depends_on:
      - pot-provider
    restart: unless-stopped

volumes:
  sqlite-data:
    driver: local
